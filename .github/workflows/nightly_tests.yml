name: Nightly full test run
on:
  schedule:
    - cron: "0 3 * * MON-FRI" # Every weekday at 03:00 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup-test-matrix:
    name: Create test matrix
    uses: ./.github/workflows/setup_test_matrix.yml # LOCAL_VERSION
    secrets: inherit
  gradle-verify:
    name: Run the tests
    if: needs.setup-test-matrix.outputs.has_tests == 'true'
    strategy:
      matrix: ${{ fromJson(needs.setup-test-matrix.outputs.matrix) }}
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/gradle_verify.yml@v2 # WORKFLOW_VERSION
    secrets: inherit
    with:
      gradle-command: ./gradlew ${{ matrix.tests }}
      localstack-tag: "4"
      postgres-tag: "18"
      postgres-username: "migration"
      postgres-password: "migration"
      postgres-db: 'migration'
      artifact-name: ${{ matrix.tests }}
      java-version: "25"
      test-report-continue-on-error: true
    needs:
      - setup-test-matrix
  notify:
    name: Notify failure
    if: failure()
    runs-on: ubuntu-latest
    needs:
      - setup-test-matrix
      - gradle-verify
    steps:
      - name: Slack message for failed nightly run
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.HMPPS_SRE_SLACK_BOT_TOKEN }}
          payload-templated: true
          payload: |
            channel: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID }}
            text: "Nightly full test run failed"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: ":warning: Nightly full test run failed"
              - type: section
                fields:
                  - type: mrkdwn
                    text: "*Workflow:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }}>"
                  - type: mrkdwn
                    text: "*Repository:*\n${{ github.repository }}"
