name: Setup test matrix
on:
  workflow_call:
    secrets:
      GRADLE_CACHE_ENCRYPTION_KEY:
        required: false
    inputs:
      java-version:
        type: string
        required: false
        default: '25'
      run-all:
        type: boolean
        required: false
        default: false
    outputs:
      matrix:
        value: ${{ jobs.create_matrix.outputs.task_output }}
      has_tests:
        value: ${{ jobs.create_matrix.outputs.has_tests }}

permissions:
  contents: read
jobs:
  create_matrix:
    name: Create test matrix
    runs-on: ubuntu-latest
    outputs:
      task_output: ${{ steps.create_matrix.outputs.taskoutput }}
      has_tests: ${{ steps.create_matrix.outputs.has_tests }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '${{ inputs.java-version }}'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
      - name: Create test matrix
        id: create_matrix
        shell: bash
        env:
          TEST_SELECTION: ${{ vars.TEST_SELECTION }}
          RUN_ALL_INPUT: ${{ inputs.run-all }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          CHANGED_FILES="$RUNNER_TEMP/changed-files.txt"
          SUMMARY_FILE="$RUNNER_TEMP/test-selection-summary.md"
          RUN_ALL=false
          # Only pushes to a feature branch have a meaningful diff against main
          if [[ "$RUN_ALL_INPUT" == "true" || "$EVENT_NAME" != "push" || "$REF_NAME" == "main" || "$COMMIT_MESSAGE" == *"[run-all]"* ]]; then
            RUN_ALL=true
          elif git fetch --no-tags origin main && git diff --name-only "$(git merge-base origin/main HEAD)" HEAD > "$CHANGED_FILES"; then
            :
          else
            echo "Unable to work out the changed files, running all tests"
            RUN_ALL=true
          fi
          [[ -f "$CHANGED_FILES" ]] || : > "$CHANGED_FILES"
          ARGS=(--mode="${TEST_SELECTION:-shadow}" --changed-files="$CHANGED_FILES" --summary-file="$SUMMARY_FILE")
          if [[ "$RUN_ALL" == "true" ]]; then ARGS+=(--run-all); fi
          MATRIX=$(./gradlew -q selectTests "${ARGS[@]}" | grep '^{"tests"')
          echo "taskoutput=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "has_tests=$(echo "$MATRIX" | jq '.tests|length>0')" >> "$GITHUB_OUTPUT"
          if [[ -f "$SUMMARY_FILE" ]]; then cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"; fi
